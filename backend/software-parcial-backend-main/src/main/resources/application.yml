server:
  port: 8080

spring:
  application:
    name: arqnova-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB
# Logging
logging:
  level:
    root: INFO
    com.arqnova: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Custom application properties
app:
  avatars:
    dir: ./uploads/avatars
  cors:
    allowed-origins: http://localhost:4200
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-6.1-sol}
    image-model: ${OPENAI_IMAGE_MODEL:gpt-6.1-sol}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:45}
