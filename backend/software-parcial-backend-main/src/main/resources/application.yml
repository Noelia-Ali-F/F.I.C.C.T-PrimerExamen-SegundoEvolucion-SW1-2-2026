server:
  port: 8080

spring:
  application:
    name: arqnova-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB
  ai:
    vertex:
      ai:
        gemini:
          project-id: ${GCP_PROJECT_ID:${VERTEX_AI_PROJECT_ID:}}
          location: us-central1
          chat:
            options:
              model: gemini-2.5-flash
              temperature: 0.1

# Logging
logging:
  level:
    root: INFO
    com.arqnova: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Custom application properties
app:
  avatars:
    dir: ./uploads/avatars
  cors:
    allowed-origins: http://localhost:4200
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:25}
    retry-base-ms: ${GEMINI_RETRY_BASE_MS:1000}
