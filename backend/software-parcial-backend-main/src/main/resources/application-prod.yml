spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.arqnova: INFO

app:
  avatars:
    dir: /app/uploads/avatars
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-6.1-sol}
    image-model: ${OPENAI_IMAGE_MODEL:gpt-6.1-sol}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:45}
