# AWS DynamoDB: activate only after verified migration. See docs/dynamodb.md.
services:
  backend:
    build:
      context: ./backend/software-parcial-backend-main
    image: arqnova-backend:latest
    container_name: arqnova-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod,dynamodb
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET es obligatorio}
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_IMAGE_MODEL: ${GROQ_IMAGE_MODEL:-qwen/qwen3.8-27b}
      GROQ_IMAGE_MAX_TOKENS: ${GROQ_IMAGE_MAX_TOKENS:-8192}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-22}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-sol}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-6.1-sol}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      PORT: 8080
      AWS_REGION: ${AWS_REGION:-us-east-2}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-arqnova}
      DYNAMODB_ENDPOINT: ""
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
    ports:
      - "${BACKEND_PUBLIC_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend/arqnova-frontend
    image: arqnova-frontend:latest
    container_name: arqnova-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: ${FRONTEND_API_URL:-}
    ports:
      - "${FRONTEND_PUBLIC_PORT:-8081}:8080"

  gateway:
    image: caddy:2-alpine
    container_name: arqnova-gateway
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      ARQNOVA_DOMAIN: ${ARQNOVA_DOMAIN:-18-116-164-204.sslip.io}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  backend_uploads:
  caddy_data:
  caddy_config:
