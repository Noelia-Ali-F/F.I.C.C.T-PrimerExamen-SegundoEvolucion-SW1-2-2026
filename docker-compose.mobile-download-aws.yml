# Public Android releases are stored outside Git and survive frontend replacement.
services:
  frontend:
    image: arqnova-frontend:${MOBILE_DOWNLOAD_WEB_RELEASE:-cu1-audited-20261109}
    volumes:
      - type: bind
        source: /home/ubuntu/arqnova-downloads
        target: /usr/share/nginx/html/downloads
        read_only: true
